services:
  mongodb:
    image: mongo:${MONGODB_VERSION}
    ports:
      - "${MONGODB_PORT}:${MONGODB_PORT}"
    volumes:
      - mongo_volume:/data/db
    environment:
      MONGODB_HOST: ${MONGODB_HOST}
      MONGODB_PORT: ${MONGODB_PORT}
      MONGODB_DB_NAME: ${MONGODB_DATABASE}

volumes:
  mongo_volume:
