name: 'Setup UV Project'
description: 'Setup Python with uv and install dependencies'

inputs:
  python-version:
    description: 'Python version'
    required: false
    default: '3.11'
  uv-version:
    description: 'uv version'
    required: false
    default: 'latest'
  with-tests:
    description: 'Install test dependencies'
    required: false
    default: 'false'
  all-extras:
    description: 'Install all optional dependencies'
    required: false
    default: 'false'
  extras:
    description: 'Comma-separated list of optional dependency groups to install (e.g., "dev,docs")'
    required: false
    default: ''
  no-dev:
    description: 'Do not install dev dependencies'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        version: ${{ inputs.uv-version }}
        enable-cache: true

    - name: Set up Python
      shell: bash
      run: uv python install ${{ inputs.python-version }}

    - name: Install dependencies
      shell: bash
      run: |
        UV_SYNC_CMD="uv sync --frozen"
        
        # Добавляем --no-dev если указано
        if [ "${{ inputs.no-dev }}" = "true" ]; then
          UV_SYNC_CMD="$UV_SYNC_CMD --no-dev"
        fi
        
        # Обработка all-extras имеет приоритет над конкретными extras
        if [ "${{ inputs.all-extras }}" = "true" ]; then
          UV_SYNC_CMD="$UV_SYNC_CMD --all-extras"
        else
          # Добавляем конкретные extras, если они указаны
          if [ -n "${{ inputs.extras }}" ]; then
            # Преобразуем comma-separated список в формат для uv
            EXTRAS_LIST=$(echo "${{ inputs.extras }}" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | tr '\n' ',' | sed 's/,$//')
            UV_SYNC_CMD="$UV_SYNC_CMD --extra $EXTRAS_LIST"
          fi
        fi
        
        # Добавляем тестовую группу, если нужно
        if [ "${{ inputs.with-tests }}" = "true" ]; then
          UV_SYNC_CMD="$UV_SYNC_CMD --group tests"
        fi
        
        echo "Running: $UV_SYNC_CMD"
        $UV_SYNC_CMD