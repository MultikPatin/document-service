name: Ruff

on:
  workflow_call:
    inputs:
      python-version:
        required: true
        type: string
      uv-version:
        required: true
        type: string
      ruff-version:
        required: false
        type: string
        default: 'latest'

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-uv-project
        with:
          python-version: ${{ inputs.python-version }}
          uv-version: ${{ inputs.uv-version }}
          all-extras: 'true'

      - name: Install Ruff via uv tool
        shell: bash
        run: |
          if [ "${{ inputs.ruff-version }}" = "latest" ]; then
            uv tool install ruff
          else
            uv tool install ruff==${{ inputs.ruff-version }}
          fi

      - name: Run Ruff linter
        run: ruff check .

      - name: Run Ruff formatter
        run: ruff format --check