name: Ruff

on:
  workflow_call:
    inputs:
      python-version:
        required: true
        type: string
      uv-version:
        required: true
        type: string

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-uv-project
        with:
          python-version: ${{ inputs.python-version }}
          uv-version: ${{ inputs.uv-version }}
          all-extras: 'true'

      - name: Verify installed versions
        shell: bash
        run: |
          echo "========================================"
          echo "Installed versions in Ruff Action:"
          echo "========================================"
          echo "Python: $(python --version 2>&1)"
          echo "UV: $(uv --version)"
          echo "Ruff: $(uv run ruff --version)"
          echo "========================================"
          echo "Requested versions:"
          echo "Python (input): ${{ inputs.python-version }}"
          echo "UV (input): ${{ inputs.uv-version }}"
          echo "========================================"

      - name: Run Ruff linter
        run: uv run ruff check .

      - name: Run Ruff formatter
        run: uv run ruff format --check