name: Ty

on:
  workflow_call:
    inputs:
      python-version:
        required: false
        type: string
        default: '3.14'
      uv-version:
        required: false
        type: string
        default: '0.10.7'

jobs:
  ty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-uv-project
        with:
          python-version: ${{ inputs.python-version }}
          uv-version: ${{ inputs.uv-version }}
          all-extras: 'true'

      - name: Verify installed versions
        shell: bash
        run: |
          echo "========================================"
          echo "Installed versions in Ty Action:"
          echo "========================================"
          echo "Python: $(python --version 2>&1)"
          echo "UV: $(uv --version)"
          echo "Ty: $(uv run ty --version)"
          echo "========================================"
          echo "Requested versions:"
          echo "Python (input): ${{ inputs.python-version }}"
          echo "UV (input): ${{ inputs.uv-version }}"
          echo "========================================"

      - name: Run ty checker
        run: uv run ty check .